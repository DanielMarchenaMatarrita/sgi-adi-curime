name: CI

on:
  push:
    branches: [master, feature/**]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sgi_user
          POSTGRES_PASSWORD: sgi_password
          POSTGRES_DB: sgi_curime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgi_user -d sgi_curime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sgi_user:sgi_password@localhost:5432/sgi_curime
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: ci-only-jwt-secret
      JWT_EXPIRES_IN: 1h
      ACTIVATION_TOKEN_TTL_HOURS: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Apply database migrations
        run: npm --prefix backend run db:migrate:deploy

      - name: Verify frontend
        run: |
          npm --prefix frontend test
          npm --prefix frontend run lint
          npm --prefix frontend run build

      - name: Verify backend
        run: |
          npm --prefix backend test
          npm --prefix backend run test:e2e
          npm --prefix backend run lint
          npm --prefix backend run build
